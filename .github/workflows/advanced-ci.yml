name: Enterprise AI/ML CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # 2. The Climate Simulator (Matrix Strategy)
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        
    - name: 1. The Strict Inspector (Linting)
      run: |
        # Fails the build if there are critical Python syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: 3. The X-Ray Scanner (Code Coverage)
      run: |
        # Runs tests and demands a coverage report
        pytest --cov=math_operations test_math_operations.py
